      <stop offset="0%" stop-color="#18251D"/>
      <stop offset="55%" stop-color="#101812"/>
      <stop offset="100%" stop-color="#0B110D"/>
    </radialGradient>
    <linearGradient id="potli" x1="0" y1="0" x2="1" y2="0">
