<svg width="300" height="620" viewBox="0 0 300 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="apna live map screen">
  <defs>
    <clipPath id="scr4"><rect x="14" y="14" width="272" height="592" rx="30"/></clipPath>
    <style>
      .mono{font-family:'Spline Sans Mono','JetBrains Mono',monospace;}
      .sans{font-family:'General Sans','Segoe UI',sans-serif;}
      .disp{font-family:'Cabinet Grotesk','Segoe UI',sans-serif;font-weight:800;}
    </style>
  </defs>
  <rect x="6" y="6" width="288" height="608" rx="38" fill="#0C0B09"/>
  <rect x="10" y="10" width="280" height="600" rx="34" fill="#161512" stroke="#26231D" stroke-width="1.5"/>
  <g clip-path="url(#scr4)">
    <!-- Ink map style -->
    <rect x="14" y="14" width="272" height="592" fill="#12100D"/>
    <rect x="14" y="380" width="272" height="226" fill="#0D1109"/> <!-- park/land tint -->
    <!-- water -->
    <path d="M14 14 H286 V120 Q210 150 150 120 T14 150 Z" fill="#0F1418"/>
    <!-- roads -->
    <g stroke="#26231D" stroke-width="6" fill="none" stroke-linecap="round">
      <path d="M40 40 C120 200 180 260 260 300"/>
      <path d="M20 320 C110 300 180 360 280 340"/>
      <path d="M150 60 L150 560"/>
    </g>
    <g stroke="#1D1B17" stroke-width="2.5" fill="none">
      <path d="M60 500 L240 460"/>
      <path d="M80 200 L230 240"/>
    </g>
    <!-- route overlay (madder stitch) -->
    <path d="M96 430 C140 360 150 300 190 250 C215 220 220 190 205 150" fill="none" stroke="#D96A50" stroke-width="3" stroke-dasharray="9 6" opacity="0.85"/>

    <!-- friend pins -->
    <g class="mono" font-size="10" text-anchor="middle">
      <g transform="translate(205,150)"><path d="M0 8 L-12 -8 A14 14 0 1 1 12 -8 Z" fill="#D96A50"/><circle cy="-6" r="9" fill="#161512"/><text y="-2" fill="#EFEAE0">A</text></g>
      <g transform="translate(96,430)"><path d="M0 8 L-12 -8 A14 14 0 1 1 12 -8 Z" fill="#8FAE9A"/><circle cy="-6" r="9" fill="#161512"/><text y="-2" fill="#EFEAE0">Y</text></g>
      <g transform="translate(238,300)"><path d="M0 8 L-12 -8 A14 14 0 1 1 12 -8 Z" fill="#7FA0B8"/><circle cy="-6" r="9" fill="#161512"/><text y="-2" fill="#EFEAE0">R</text></g>
      <g transform="translate(120,250)"><path d="M0 8 L-12 -8 A14 14 0 1 1 12 -8 Z" fill="#A98BB8"/><circle cy="-6" r="9" fill="#161512"/><text y="-2" fill="#EFEAE0">M</text></g>
    </g>
    <!-- itinerary pin -->
    <g transform="translate(205,150)"><circle r="22" fill="none" stroke="#C9A24B" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/></g>

    <text x="30" y="40" class="mono" font-size="11" fill="#EFEAE0">9:41</text>
    <!-- top pill: sharing status -->
    <rect x="82" y="54" width="136" height="30" rx="15" fill="#1D1B17" opacity="0.95"/>
    <circle cx="100" cy="69" r="4" fill="#8FAE9A"/>
    <text x="112" y="73" class="sans" font-size="11" fill="#EFEAE0">Sharing · 4 live</text>

    <!-- ghost mode + SOS controls -->
    <g transform="translate(252,120)">
      <circle r="18" fill="#1D1B17"/><text y="4" class="sans" font-size="9" fill="#A39B89" text-anchor="middle">ghost</text>
    </g>
    <g transform="translate(252,166)">
      <circle r="18" fill="#D96A50"/><text y="4" class="disp" font-size="10" fill="#2A0E06" text-anchor="middle">SOS</text>
    </g>

    <!-- bottom sheet: member list -->
    <rect x="14" y="470" width="272" height="136" rx="24" fill="#1D1B17"/>
    <rect x="132" y="482" width="36" height="4" rx="2" fill="#736D5E"/>
    <g class="sans">
      <circle cx="40" cy="518" r="12" fill="#D96A50"/><text x="40" y="522" class="mono" font-size="9" fill="#2A0E06" text-anchor="middle">A</text>
      <text x="62" y="515" font-size="12" fill="#EFEAE0">Aisha</text>
      <text x="62" y="530" font-size="10" fill="#A39B89">at Anjuna Beach · 2 min ago</text>
      <text x="256" y="522" class="mono" font-size="11" fill="#8FAE9A" text-anchor="end">1.2 km</text>

      <line x1="30" y1="546" x2="270" y2="546" stroke="rgba(239,234,224,0.08)" stroke-width="1"/>
      <circle cx="40" cy="574" r="12" fill="#7FA0B8"/><text x="40" y="578" class="mono" font-size="9" fill="#2A0E06" text-anchor="middle">R</text>
      <text x="62" y="571" font-size="12" fill="#EFEAE0">Rohan</text>
      <text x="62" y="586" font-size="10" fill="#A39B89">en route · buffer 15 min</text>
      <text x="256" y="578" class="mono" font-size="11" fill="#C9A24B" text-anchor="end">3.4 km</text>
    </g>
  </g>
</svg>
