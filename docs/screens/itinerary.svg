<svg width="300" height="620" viewBox="0 0 300 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="apna itinerary screen">
  <defs>
    <clipPath id="scr6"><rect x="14" y="14" width="272" height="592" rx="30"/></clipPath>
    <style>
      .mono{font-family:'Spline Sans Mono','JetBrains Mono',monospace;}
      .sans{font-family:'General Sans','Segoe UI',sans-serif;}
      .disp{font-family:'Cabinet Grotesk','Segoe UI',sans-serif;font-weight:800;}
    </style>
  </defs>
  <rect x="6" y="6" width="288" height="608" rx="38" fill="#0C0B09"/>
  <rect x="10" y="10" width="280" height="600" rx="34" fill="#161512" stroke="#26231D" stroke-width="1.5"/>
  <g clip-path="url(#scr6)">
    <rect x="14" y="14" width="272" height="592" fill="#161512"/>
    <text x="30" y="40" class="mono" font-size="11" fill="#A39B89">9:41</text>
    <text x="30" y="78" class="disp" font-size="22" fill="#EFEAE0">Itinerary</text>
    <text x="30" y="96" class="sans" font-size="11" fill="#A39B89">Goa Trip · Day 2 of 3</text>
    <!-- day tabs -->
    <g class="sans" font-size="11" text-anchor="middle">
      <rect x="188" y="66" width="28" height="26" rx="13" fill="#26231D"/><text x="202" y="83" fill="#A39B89">1</text>
      <rect x="220" y="66" width="28" height="26" rx="13" fill="#D96A50"/><text x="234" y="83" fill="#2A0E06">2</text>
      <rect x="252" y="66" width="22" height="26" rx="11" fill="#26231D"/><text x="263" y="83" fill="#A39B89">3</text>
    </g>

    <!-- vertical stitch timeline -->
    <line x1="46" y1="130" x2="46" y2="520" stroke="#D96A50" stroke-width="2" stroke-dasharray="6 6" opacity="0.55"/>

    <!-- item 1 (done) -->
    <circle cx="46" cy="150" r="6" fill="#8F8878"/>
    <text x="64" y="140" class="mono" font-size="11" fill="#736D5E">08:30</text>
    <rect x="64" y="148" width="210" height="52" rx="14" fill="#1D1B17"/>
    <text x="80" y="170" class="sans" font-size="13" fill="#A39B89" text-decoration="line-through">Breakfast · Cafe Bodega</text>
    <text x="80" y="188" class="sans" font-size="10" fill="#736D5E">45 min · done</text>

    <!-- item 2 (now) -->
    <circle cx="46" cy="230" r="7" fill="#D96A50"/>
    <circle cx="46" cy="230" r="12" fill="none" stroke="#D96A50" stroke-width="1.5" opacity="0.5"/>
    <text x="64" y="220" class="mono" font-size="11" fill="#EFEAE0">11:00</text>
    <rect x="64" y="228" width="210" height="72" rx="14" fill="#26231D" stroke="#D96A50" stroke-width="1"/>
    <text x="80" y="250" class="sans" font-size="13" fill="#EFEAE0">Fort Aguada</text>
    <text x="80" y="268" class="sans" font-size="10" fill="#A39B89">90 min · 3.4 km · now</text>
    <!-- votes -->
    <g transform="translate(80,278)">
      <circle r="8" fill="#8FAE9A"/><text y="3" class="mono" font-size="8" fill="#2A0E06" text-anchor="middle">Y</text>
      <circle cx="16" r="8" fill="#7FA0B8"/><text x="16" y="3" class="mono" font-size="8" fill="#2A0E06" text-anchor="middle">R</text>
      <circle cx="32" r="8" fill="#A98BB8"/><text x="32" y="3" class="mono" font-size="8" fill="#2A0E06" text-anchor="middle">M</text>
      <text x="52" y="3" class="sans" font-size="10" fill="#8FAE9A">3 yes</text>
    </g>

    <!-- buffer warning -->
    <rect x="64" y="312" width="210" height="30" rx="10" fill="rgba(201,162,75,0.14)"/>
    <text x="80" y="331" class="sans" font-size="10" fill="#C9A24B">Tight buffer — 15 min to next stop</text>

    <!-- item 3 (upcoming) -->
    <circle cx="46" cy="372" r="6" fill="#736D5E"/>
    <text x="64" y="362" class="mono" font-size="11" fill="#A39B89">13:30</text>
    <rect x="64" y="370" width="210" height="52" rx="14" fill="#1D1B17"/>
    <text x="80" y="392" class="sans" font-size="13" fill="#EFEAE0">Lunch · Vinayak Family</text>
    <text x="80" y="410" class="sans" font-size="10" fill="#736D5E">60 min · voting open</text>

    <!-- item 4 -->
    <circle cx="46" cy="452" r="6" fill="#736D5E"/>
    <text x="64" y="442" class="mono" font-size="11" fill="#A39B89">17:00</text>
    <rect x="64" y="450" width="210" height="52" rx="14" fill="#1D1B17"/>
    <text x="80" y="472" class="sans" font-size="13" fill="#EFEAE0">Sunset · Chapora Fort</text>
    <text x="80" y="490" class="sans" font-size="10" fill="#736D5E">Golden hour 18:12</text>

    <!-- FAB add -->
    <circle cx="240" cy="524" r="24" fill="#D96A50"/>
    <text x="240" y="532" font-size="22" fill="#2A0E06" text-anchor="middle" class="disp">+</text>

    <!-- tab bar -->
    <rect x="14" y="558" width="272" height="48" fill="#1D1B17"/>
    <g class="sans" font-size="9" text-anchor="middle">
      <text x="56" y="586" fill="#736D5E">Money</text>
      <text x="118" y="586" fill="#736D5E">Map</text>
      <text x="182" y="586" fill="#EFEAE0">Trip</text>
      <rect x="170" y="592" width="24" height="2" rx="1" fill="#D96A50"/>
      <text x="244" y="586" fill="#736D5E">You</text>
    </g>
  </g>
</svg>
