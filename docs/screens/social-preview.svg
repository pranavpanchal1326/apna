<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="apna social preview banner">
  <defs>
    <style>
      .mono{font-family:'Spline Sans Mono','JetBrains Mono',monospace;}
      .sans{font-family:'General Sans','Segoe UI',sans-serif;}
      .disp{font-family:'Cabinet Grotesk','Segoe UI',sans-serif;font-weight:800;}
    </style>
    <radialGradient id="glow" cx="72%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#26231D"/>
      <stop offset="100%" stop-color="#161512"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- running stitch band across -->
  <line x1="0" y1="150" x2="1280" y2="150" stroke="#D96A50" stroke-width="3" stroke-dasharray="16 12" opacity="0.28"/>
  <line x1="0" y1="500" x2="1280" y2="500" stroke="#8FAE9A" stroke-width="3" stroke-dasharray="16 12" opacity="0.18"/>

  <!-- left: brand + tagline. Wordmark geometry mirrors assets/brand/apna-wordmark-ink.svg, scaled 1.95x -->
  <g transform="translate(88,176) scale(1.95)">
    <circle cx="30" cy="48" r="17" fill="none" stroke="#D96A50" stroke-width="5.5"
            stroke-linecap="round" stroke-dasharray="9.02 6.24" stroke-dashoffset="4.5"/>
    <path d="M 50 30 L 50 55 Q 50 68 62 65" fill="none" stroke="#D96A50"
          stroke-width="5.5" stroke-linecap="round"/>
    <circle cx="50" cy="30" r="4.5" fill="#EFEAE0"/>
    <text x="74" y="63" class="disp" font-size="52" fill="#EFEAE0" letter-spacing="-2">pna</text>
  </g>

  <text x="98" y="356" class="sans" font-size="30" fill="#EFEAE0" font-weight="600">One app for the whole squad.</text>
  <text x="98" y="398" class="sans" font-size="22" fill="#A39B89">Money, memories, maps and moments — permanently connected.</text>

  <!-- feature pills -->
  <g class="sans" font-size="18">
    <rect x="98" y="430" width="168" height="42" rx="21" fill="#1D1B17" stroke="#26231D"/>
    <text x="182" y="457" fill="#EFEAE0" text-anchor="middle">Split &amp; settle</text>
    <rect x="278" y="430" width="176" height="42" rx="21" fill="#1D1B17" stroke="#26231D"/>
    <text x="366" y="457" fill="#EFEAE0" text-anchor="middle">Live location</text>
    <rect x="466" y="430" width="150" height="42" rx="21" fill="#1D1B17" stroke="#26231D"/>
    <text x="541" y="457" fill="#EFEAE0" text-anchor="middle">Memories</text>
  </g>

  <text x="98" y="548" class="mono" font-size="16" fill="#736D5E">React Native · Expo · Firebase asia-south1 · MapLibre · TypeScript strict</text>

  <!-- right: three tilted phone cards -->
  <g transform="translate(900,320)">
    <g transform="rotate(-9) translate(-150,-30)">
      <rect x="0" y="0" width="150" height="310" rx="24" fill="#0C0B09"/>
      <rect x="6" y="6" width="138" height="298" rx="20" fill="#161512"/>
      <rect x="22" y="40" width="106" height="54" rx="12" fill="#1D1B17"/>
      <rect x="30" y="52" width="4" height="30" rx="2" fill="#8FAE9A"/>
      <text x="44" y="66" class="sans" font-size="8" fill="#A39B89">You are owed</text>
      <text x="44" y="86" class="mono" font-size="18" fill="#8FAE9A">₹2,340</text>
      <rect x="22" y="106" width="106" height="30" rx="8" fill="#1D1B17"/>
      <rect x="22" y="142" width="106" height="30" rx="8" fill="#1D1B17"/>
      <rect x="22" y="178" width="106" height="30" rx="8" fill="#1D1B17"/>
      <line x1="22" y1="224" x2="128" y2="224" stroke="#D96A50" stroke-width="2" stroke-dasharray="7 5" opacity="0.55"/>
      <circle cx="112" cy="262" r="16" fill="#D96A50"/><text x="112" y="269" class="disp" font-size="18" fill="#2A0E06" text-anchor="middle">+</text>
    </g>
    <g transform="translate(10,-70)">
      <rect x="0" y="0" width="158" height="330" rx="26" fill="#0C0B09"/>
      <rect x="6" y="6" width="146" height="318" rx="22" fill="#12100D"/>
      <path d="M6 6 H152 V70 Q100 88 60 72 T6 90 Z" fill="#0F1418"/>
      <g stroke="#26231D" stroke-width="4" fill="none"><path d="M20 30 C60 130 100 170 150 190"/><path d="M80 20 L80 300"/></g>
      <path d="M40 250 C70 200 78 150 110 110" fill="none" stroke="#D96A50" stroke-width="2.5" stroke-dasharray="7 5"/>
      <g><path d="M110 110 l-8 -12 a10 10 0 1 1 16 0 z" fill="#D96A50"/><circle cx="110" cy="100" r="6" fill="#12100D"/></g>
      <g><path d="M40 250 l-8 -12 a10 10 0 1 1 16 0 z" fill="#8FAE9A"/><circle cx="40" cy="240" r="6" fill="#12100D"/></g>
      <rect x="14" y="250" width="130" height="66" rx="16" fill="#1D1B17"/>
      <circle cx="34" cy="278" r="8" fill="#D96A50"/>
      <rect x="50" y="270" width="70" height="6" rx="3" fill="#EFEAE0" opacity="0.8"/>
      <rect x="50" y="284" width="50" height="5" rx="2.5" fill="#A39B89"/>
    </g>
  </g>
</svg>
