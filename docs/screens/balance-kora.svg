<svg width="300" height="620" viewBox="0 0 300 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="apna balance screen, Kora light theme">
  <defs>
    <clipPath id="scrk"><rect x="14" y="14" width="272" height="592" rx="30"/></clipPath>
    <style>
      .mono{font-family:'Spline Sans Mono','JetBrains Mono',monospace;}
      .sans{font-family:'General Sans','Segoe UI',sans-serif;}
      .disp{font-family:'Cabinet Grotesk','Segoe UI',sans-serif;font-weight:800;}
    </style>
  </defs>
  <rect x="6" y="6" width="288" height="608" rx="38" fill="#D8CFBD"/>
  <rect x="10" y="10" width="280" height="600" rx="34" fill="#F3EEE4" stroke="#E4DCC9" stroke-width="1.5"/>
  <g clip-path="url(#scrk)">
    <rect x="14" y="14" width="272" height="592" fill="#F3EEE4"/>
    <text x="30" y="40" class="mono" font-size="11" fill="#6E675A">9:41</text>
    <circle cx="252" cy="36" r="3" fill="#6E675A"/><circle cx="262" cy="36" r="3" fill="#6E675A"/><circle cx="272" cy="36" r="3" fill="#948C7A"/>
    <!-- header -->
    <text x="30" y="78" class="disp" font-size="22" fill="#1C1A15">Goa Trip</text>
    <text x="30" y="96" class="sans" font-size="11" fill="#6E675A">5 members · Trip mode on</text>
    <g transform="translate(232,64)"><circle r="15" fill="#E4DCC9"/><circle cx="-11" r="15" fill="#ECE5D6"/><text x="-4" y="4" class="mono" font-size="10" fill="#1C1A15">+5</text></g>
    <!-- balance card -->
    <rect x="26" y="112" width="248" height="94" rx="18" fill="#ECE5D6"/>
    <rect x="26" y="112" width="4" height="94" rx="2" fill="#3E5C50"/>
    <text x="44" y="138" class="sans" font-size="11" fill="#6E675A">You are owed</text>
    <text x="44" y="172" class="mono" font-size="30" fill="#3E5C50">₹2,340</text>
    <text x="44" y="194" class="sans" font-size="10" fill="#948C7A">across 3 people · settle in 2 taps</text>
    <!-- section label -->
    <text x="30" y="238" class="sans" font-size="11" fill="#948C7A" letter-spacing="1">RECENT EXPENSES</text>
    <!-- rows -->
    <g class="sans">
      <rect x="26" y="250" width="248" height="56" rx="14" fill="#ECE5D6"/>
      <circle cx="52" cy="278" r="15" fill="rgba(138,106,31,0.15)"/>
      <text x="45" y="283" font-size="13" fill="#8A6A1F">◍</text>
      <text x="78" y="273" font-size="13" fill="#1C1A15">Beach shack dinner</text>
      <text x="78" y="290" font-size="10" fill="#6E675A">Aisha paid · split 5 ways</text>
      <text x="258" y="274" class="mono" font-size="13" fill="#1C1A15" text-anchor="end">₹4,200</text>
      <text x="258" y="291" class="mono" font-size="10" fill="#3E5C50" text-anchor="end">+₹840</text>

      <rect x="26" y="314" width="248" height="56" rx="14" fill="#ECE5D6"/>
      <circle cx="52" cy="342" r="15" fill="rgba(62,92,80,0.15)"/>
      <text x="46" y="347" font-size="13" fill="#3E5C50">⇢</text>
      <text x="78" y="337" font-size="13" fill="#1C1A15">Scooter rental</text>
      <text x="78" y="354" font-size="10" fill="#6E675A">You paid · split 4 ways</text>
      <text x="258" y="338" class="mono" font-size="13" fill="#1C1A15" text-anchor="end">₹1,600</text>
      <text x="258" y="355" class="mono" font-size="10" fill="#3E5C50" text-anchor="end">+₹1,200</text>

      <rect x="26" y="378" width="248" height="56" rx="14" fill="#ECE5D6"/>
      <circle cx="52" cy="406" r="15" fill="rgba(176,64,47,0.13)"/>
      <text x="46" y="411" font-size="13" fill="#B0402F">✦</text>
      <text x="78" y="401" font-size="13" fill="#1C1A15">Souvenirs</text>
      <text x="78" y="418" font-size="10" fill="#6E675A">Rohan paid · custom split</text>
      <text x="258" y="402" class="mono" font-size="13" fill="#1C1A15" text-anchor="end">₹900</text>
      <text x="258" y="419" class="mono" font-size="10" fill="#B0402F" text-anchor="end">−₹300</text>
    </g>
    <!-- running stitch divider -->
    <line x1="30" y1="454" x2="270" y2="454" stroke="#B0402F" stroke-width="2" stroke-dasharray="9 6" opacity="0.6"/>
    <!-- FAB -->
    <circle cx="240" cy="512" r="26" fill="#B0402F"/>
    <text x="240" y="520" font-size="26" fill="#F9F1EC" text-anchor="middle" class="disp">+</text>
    <!-- tab bar -->
    <rect x="14" y="558" width="272" height="48" fill="#ECE5D6"/>
    <g class="sans" font-size="9" text-anchor="middle">
      <text x="56" y="586" fill="#1C1A15">Money</text>
      <rect x="44" y="592" width="24" height="2" rx="1" fill="#B0402F"/>
      <text x="118" y="586" fill="#948C7A">Map</text>
      <text x="182" y="586" fill="#948C7A">Trip</text>
      <text x="244" y="586" fill="#948C7A">You</text>
    </g>
  </g>
</svg>
