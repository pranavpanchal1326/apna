<svg width="720" height="150" viewBox="0 0 720 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ink theme palette">
  <defs><style>
    .lab{font-family:'General Sans','Segoe UI',sans-serif;font-size:11px;}
    .hex{font-family:'Spline Sans Mono','JetBrains Mono',monospace;font-size:11px;}
    .cap{font-family:'Cabinet Grotesk','Segoe UI',sans-serif;font-weight:800;font-size:14px;}
  </style></defs>
  <rect width="720" height="150" rx="14" fill="#161512"/>
  <text x="20" y="30" class="cap" fill="#EFEAE0">Ink</text>
  <text x="58" y="30" class="lab" fill="#A39B89">dark · the default, evening</text>
  <g transform="translate(20,46)">
    <!-- 8 swatches, 84px pitch -->
    <g><rect width="72" height="52" rx="10" fill="#161512" stroke="#A39B89" stroke-opacity="0.25"/><text x="0" y="70" class="lab" fill="#EFEAE0">bgPrimary</text><text x="0" y="86" class="hex" fill="#A39B89">#161512</text></g>
    <g transform="translate(84,0)"><rect width="72" height="52" rx="10" fill="#1D1B17" stroke="#A39B89" stroke-opacity="0.25"/><text x="0" y="70" class="lab" fill="#EFEAE0">bgSecondary</text><text x="0" y="86" class="hex" fill="#A39B89">#1D1B17</text></g>
    <g transform="translate(168,0)"><rect width="72" height="52" rx="10" fill="#26231D" stroke="#A39B89" stroke-opacity="0.25"/><text x="0" y="70" class="lab" fill="#EFEAE0">bgTertiary</text><text x="0" y="86" class="hex" fill="#A39B89">#26231D</text></g>
    <g transform="translate(252,0)"><rect width="72" height="52" rx="10" fill="#D96A50"/><text x="0" y="70" class="lab" fill="#EFEAE0">accentPrimary</text><text x="0" y="86" class="hex" fill="#A39B89">#D96A50</text></g>
    <g transform="translate(336,0)"><rect width="72" height="52" rx="10" fill="#8FAE9A"/><text x="0" y="70" class="lab" fill="#EFEAE0">positive</text><text x="0" y="86" class="hex" fill="#A39B89">#8FAE9A</text></g>
    <g transform="translate(420,0)"><rect width="72" height="52" rx="10" fill="#C9A24B"/><text x="0" y="70" class="lab" fill="#EFEAE0">warning</text><text x="0" y="86" class="hex" fill="#A39B89">#C9A24B</text></g>
    <g transform="translate(504,0)"><rect width="72" height="52" rx="10" fill="#EFEAE0"/><text x="0" y="70" class="lab" fill="#EFEAE0">textPrimary</text><text x="0" y="86" class="hex" fill="#A39B89">#EFEAE0</text></g>
    <g transform="translate(588,0)"><rect width="72" height="52" rx="10" fill="#A39B89"/><text x="0" y="70" class="lab" fill="#EFEAE0">textSecondary</text><text x="0" y="86" class="hex" fill="#A39B89">#A39B89</text></g>
  </g>
