  <!-- tech strip -->
  <text x="1080" y="2452" font-size="27" letter-spacing="4" text-anchor="middle" fill="#66735F" font-family="Consolas, monospace">REACT NATIVE &#183; EXPO &#183; FIREBASE ASIA-SOUTH1 &#183; MAPLIBRE &#183; TYPESCRIPT STRICT</text>

  <!-- track -->
  <line x1="0" y1="2580" x2="2160" y2="2580" stroke="#EFE9DA" stroke-opacity="0.2" stroke-width="4"/>
  <line x1="0" y1="2608" x2="2160" y2="2608" stroke="#EFE9DA" stroke-opacity="0.2" stroke-width="4"/>
