    <line x1="60" y1="2572" x2="60" y2="2616"/><line x1="180" y1="2572" x2="180" y2="2616"/><line x1="300" y1="2572" x2="300" y2="2616"/>
    <line x1="420" y1="2572" x2="420" y2="2616"/><line x1="540" y1="2572" x2="540" y2="2616"/><line x1="660" y1="2572" x2="660" y2="2616"/>
    <line x1="780" y1="2572" x2="780" y2="2616"/><line x1="900" y1="2572" x2="900" y2="2616"/><line x1="1020" y1="2572" x2="1020" y2="2616"/>
    <line x1="1140" y1="2572" x2="1140" y2="2616"/><line x1="1260" y1="2572" x2="1260" y2="2616"/><line x1="1380" y1="2572" x2="1380" y2="2616"/>
    <line x1="1500" y1="2572" x2="1500" y2="2616"/><line x1="1620" y1="2572" x2="1620" y2="2616"/><line x1="1740" y1="2572" x2="1740" y2="2616"/>
    <line x1="1860" y1="2572" x2="1860" y2="2616"/><line x1="1980" y1="2572" x2="1980" y2="2616"/><line x1="2100" y1="2572" x2="2100" y2="2616"/>
