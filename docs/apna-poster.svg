      <circle cx="600" cy="176" r="32" fill="#F2B441"/><text x="600" y="189" font-size="30" text-anchor="middle" fill="#231A05" font-weight="700">P</text>
      <circle cx="656" cy="176" r="32" fill="#7FBF8E"/><text x="656" y="189" font-size="30" text-anchor="middle" fill="#0A0F0C" font-weight="700">A</text>
      <circle cx="628" cy="216" r="32" fill="#D96A50" stroke="#0F1713" stroke-width="4"/><text x="628" y="229" font-size="30" text-anchor="middle" fill="#0A0F0C" font-weight="700">R</text>

