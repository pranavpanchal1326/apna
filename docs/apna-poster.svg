    <text x="1129" y="2336" text-anchor="middle">Memories</text>
    <rect x="1296" y="2280" width="270" height="88" rx="44" fill="none" stroke="#EFE9DA" stroke-opacity="0.24" stroke-width="2"/>
    <text x="1431" y="2336" text-anchor="middle">Potli</text>
