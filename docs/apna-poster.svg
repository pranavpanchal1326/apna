      <text x="40" y="186">Rohan</text><text x="430" y="186" text-anchor="end" fill="#A23B22" font-family="Consolas, monospace">&#8722;&#8377;1,240</text>
      <text x="40" y="236">You</text><text x="430" y="236" text-anchor="end" fill="#A23B22" font-family="Consolas, monospace">&#8722;&#8377;2,880</text>
