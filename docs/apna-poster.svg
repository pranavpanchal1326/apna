<svg width="2160" height="2700" viewBox="0 0 2160 2700" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <radialGradient id="sky" cx="50%" cy="12%" r="110%">
      <stop offset="0%" stop-color="#1A2820"/>
      <stop offset="45%" stop-color="#111A14"/>
      <stop offset="100%" stop-color="#0A100C"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F2B441" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#F2B441" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#F2B441" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="potli" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F2B441"/>
      <stop offset="100%" stop-color="#7FBF8E"/>
    </linearGradient>
    <linearGradient id="screenSheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="deep" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="50" stdDeviation="60" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="lift" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="20" stdDeviation="26" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="scr"><rect width="760" height="1560" rx="76"/></clipPath>
  </defs>

  <rect width="2160" height="2700" fill="url(#sky)"/>
  <ellipse cx="1080" cy="1700" rx="1050" ry="900" fill="url(#halo)"/>

  <!-- stars -->
  <g fill="#EFE9DA">
    <circle cx="180" cy="150" r="2.6" opacity="0.5"/><circle cx="420" cy="90" r="2" opacity="0.35"/>
    <circle cx="700" cy="200" r="2.8" opacity="0.55"/><circle cx="1000" cy="110" r="2.2" opacity="0.4"/>
    <circle cx="1320" cy="170" r="2.5" opacity="0.5"/><circle cx="1600" cy="90" r="2" opacity="0.32"/>
    <circle cx="1880" cy="180" r="2.9" opacity="0.55"/><circle cx="2040" cy="100" r="2" opacity="0.35"/>
    <circle cx="300" cy="330" r="2.1" opacity="0.35"/><circle cx="1180" cy="300" r="2.3" opacity="0.4"/>
    <circle cx="1780" cy="340" r="2.2" opacity="0.38"/><circle cx="860" cy="360" r="1.9" opacity="0.3"/>
    <circle cx="150" cy="560" r="2" opacity="0.3"/><circle cx="2010" cy="560" r="2.2" opacity="0.34"/>
    <circle cx="90 " cy="900" r="2" opacity="0.28"/><circle cx="2060" cy="980" r="2" opacity="0.3"/>
  </g>

  <!-- catenary wire -->
  <path d="M0 240 Q 540 300 1080 240 T 2160 240" fill="none" stroke="#EFE9DA" stroke-opacity="0.12" stroke-width="3"/>

  <!-- ========== HEADER ========== -->
  <g transform="translate(500,330) scale(2.6)">
    <circle cx="54" cy="66" r="26" fill="none" stroke="#D96A50" stroke-width="7" stroke-linecap="round" stroke-dasharray="13.79 9.55" stroke-dashoffset="6.9"/>
    <path d="M 84 40 L 84 76 Q 84 96 102 92" fill="none" stroke="#D96A50" stroke-width="7" stroke-linecap="round"/>
    <circle cx="84" cy="40" r="6.5" fill="#EFE9DA"/>
  </g>
  <text x="800" y="590" font-size="180" font-weight="800" letter-spacing="-9" fill="#EFE9DA">pna</text>

  <text x="1080" y="760" font-size="76" font-weight="700" text-anchor="middle" fill="#EFE9DA" letter-spacing="-1">One app for the whole squad.</text>
  <text x="1080" y="836" font-size="37" text-anchor="middle" fill="#9BA894">Money netted &#183; live location &#183; one camera roll &#183; plans that happen.</text>

