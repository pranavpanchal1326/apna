      <g transform="translate(620,44)" stroke="#EFE9DA" stroke-opacity="0.7" stroke-width="4" fill="none">
        <path d="M0 18 L8 18 M12 12 L12 18 M24 6 L24 18 M36 0 L36 18" stroke-linecap="round"/>
