<svg width="1600" height="1100" viewBox="0 0 1600 1100" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <pattern id="stripe" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="20" height="40" fill="#FF5A2C"/>
      <rect x="20" width="20" height="40" fill="#FFB627"/>
    </pattern>
    <pattern id="garland" width="52" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 5 Q 26 16 52 5" fill="none" stroke="#FFD46B" stroke-opacity="0.5" stroke-width="1.6"/>
      <path d="M26 12 q -10 5 -8 18 q 10 -3 8 -18" fill="#1FC98E"/>
      <path d="M26 12 q 10 5 8 18 q -10 -3 -8 -18" fill="#1FC98E"/>
      <circle cx="26" cy="24" r="7.5" fill="#FFB627"/>
      <circle cx="26" cy="24" r="3.6" fill="#FF5A2C"/>
      <circle cx="26" cy="36" r="2.2" fill="#FF3D6E"/>
    </pattern>
    <pattern id="garland2" width="52" height="40" patternUnits="userSpaceOnUse" patternTransform="translate(26 0)">
      <circle cx="26" cy="24" r="7.5" fill="#FF3D6E"/>
      <circle cx="26" cy="24" r="3.6" fill="#FFB627"/>
      <circle cx="26" cy="36" r="2.2" fill="#FF5A2C"/>
    </pattern>
    <radialGradient id="sky" cx="30%" cy="18%" r="100%">
      <stop offset="0%" stop-color="#1A2648"/><stop offset="60%" stop-color="#131C36"/><stop offset="100%" stop-color="#0D1428"/>
    </radialGradient>
    <filter id="sh" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000" flood-opacity="0.55"/></filter>
  </defs>

  <rect width="1600" height="1100" fill="url(#sky)"/>
  <g fill="#FFF3DD">
    <circle cx="180" cy="120" r="1.8" opacity="0.5"/><circle cx="520" cy="90" r="1.4" opacity="0.4"/><circle cx="900" cy="140" r="1.6" opacity="0.45"/>
    <circle cx="1300" cy="100" r="1.5" opacity="0.4"/><circle cx="1480" cy="180" r="1.7" opacity="0.5"/><circle cx="320" cy="230" r="1.3" opacity="0.35"/>
    <circle cx="1120" cy="220" r="1.4" opacity="0.4"/><circle cx="700" cy="250" r="1.2" opacity="0.3"/>
  </g>

  <!-- HORN OK PLEASE banner -->
  <rect x="0" y="0" width="1600" height="52" fill="url(#stripe)"/>
  <rect x="0" y="6" width="1600" height="40" fill="#10182E"/>
  <rect x="0" y="6" width="1600" height="2.5" fill="#FFB627"/><rect x="0" y="43.5" width="1600" height="2.5" fill="#FF3D6E"/>
  <text x="800" y="33" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="15" letter-spacing="6" fill="#FFB627">HORN <tspan fill="#FF3D6E">OK</tspan> PLEASE&#160;&#160;&#10022;&#160;&#160;<tspan fill="#FFF3DD">APNA JUNCTION</tspan>&#160;&#160;&#10022;&#160;&#160;<tspan fill="#1FC98E">SPLIT &#183; SETTLE &#183; SAFAR</tspan>&#160;&#160;&#10022;&#160;&#160;<tspan fill="#FFF3DD">ONE APP</tspan></text>

  <!-- toran garland -->
  <rect x="0" y="58" width="1600" height="40" fill="url(#garland)"/>
  <rect x="0" y="58" width="1600" height="40" fill="url(#garland2)"/>

  <!-- ===== LEFT COPY ===== -->
  <!-- number-plate board -->
  <g transform="translate(120,170) rotate(-0.6)">
    <rect width="300" height="66" rx="6" fill="#FFB627"/>
    <rect x="4" y="4" width="292" height="58" rx="4" fill="none" stroke="#FF5A2C" stroke-width="3"/>
    <text x="24" y="34" font-family="Arial Black" font-weight="900" font-size="19" letter-spacing="3" fill="#2A1A00">APNA JUNCTION</text>
    <text x="24" y="54" font-size="15" fill="#2A1A00">अपना जंक्शन</text>
  </g>

  <text x="118" y="330" font-family="Arial Black, sans-serif" font-weight="900" font-size="72" letter-spacing="-2" fill="#FFF3DD">One app for the</text>
  <text x="118" y="410" font-family="Arial Black, sans-serif" font-weight="900" font-size="72" letter-spacing="-2" fill="#FFF3DD">squad that asks</text>
  <text x="118" y="490" font-family="Arial Black, sans-serif" font-weight="900" font-size="72" letter-spacing="-2" fill="#FFB627">&#8220;kahan hai tu?&#8221;</text>

  <text x="120" y="560" font-size="24" fill="#C6B9E0">WhatsApp has the chat. Splitwise has the math.</text>
  <text x="120" y="596" font-size="24" fill="#C6B9E0">Google Photos has the memories. <tspan fill="#FFF3DD" font-weight="600">Apna stitches</tspan></text>
  <text x="120" y="632" font-size="24" fill="#FFF3DD" font-weight="600">them together.</text>

  <!-- CTAs -->
  <g transform="translate(120,680)">
    <rect width="270" height="60" rx="30" fill="#FFB627"/>
    <text x="135" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#2A1A00">Get the App &#8212; Free</text>
    <rect x="290" y="0" width="210" height="60" rx="30" fill="none" stroke="#FF3D6E" stroke-width="2"/>
    <text x="395" y="38" text-anchor="middle" font-size="18" fill="#FF3D6E">See How It Works</text>
  </g>

  <!-- ❖ divider flourish -->
  <text x="120" y="810" font-size="20" fill="#FF3D6E" letter-spacing="14">&#10022; &#10022; &#10022;</text>
  <text x="120" y="870" font-family="monospace" font-size="15" letter-spacing="3" fill="#8C86B8">REACT NATIVE &#183; EXPO &#183; FIREBASE &#183; MAPLIBRE &#183; TS STRICT</text>

  <!-- ===== RIGHT: phone with painted frame ===== -->
  <g transform="translate(1060,240)" filter="url(#sh)">
    <!-- painted double frame -->
    <rect x="-16" y="-16" width="372" height="720" rx="52" fill="#FFB627"/>
    <rect x="-8" y="-8" width="356" height="704" rx="46" fill="none" stroke="#FF3D6E" stroke-width="2.5" stroke-dasharray="6 5"/>
    <rect x="0" y="0" width="340" height="688" rx="42" fill="#0B1020"/>
    <rect x="12" y="12" width="316" height="664" rx="32" fill="#131C36"/>
    <rect x="133" y="22" width="74" height="18" rx="9" fill="#0B1020"/>

