    <rect x="40" y="146" width="6" height="50" rx="3" fill="#1FC98E"/>
    <text x="58" y="164" font-size="10" letter-spacing="3" fill="#C6B9E0">YOU ARE OWED</text>
    <text x="58" y="200" font-family="monospace" font-size="30" fill="#1FC98E">+&#8377;2,340</text>
    <rect x="228" y="150" width="72" height="34" rx="17" fill="#FFB627"/>
    <text x="264" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#2A1A00">Settle</text>

    <!-- potli -->
