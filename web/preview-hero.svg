    <rect x="24" y="258" width="292" height="10" rx="5" fill="#1F2E54"/>
    <rect x="24" y="258" width="234" height="10" rx="5" fill="#FFB627"/>
    <rect x="234" y="258" width="24" height="10" rx="5" fill="#1FC98E"/>
    <text x="24" y="292" font-size="12" fill="#C6B9E0">&#8377;48,320 of &#8377;60,000 &#183; <tspan fill="#1FC98E">&#8377;11,680 left</tspan></text>

    <!-- map -->
    <rect x="24" y="308" width="292" height="104" rx="12" fill="#12233A"/>
    <path d="M20 380 Q 120 400 200 350 T 330 340" stroke="#24406A" stroke-width="8" fill="none"/>
    <path d="M60 420 Q 120 360 200 350" stroke="#FF3D6E" stroke-width="3" stroke-dasharray="7 6" fill="none"/>
    <circle cx="60" cy="392" r="9" fill="#1FC98E"/><circle cx="60" cy="392" r="4" fill="#12233A"/>
    <circle cx="304" cy="340" r="9" fill="#FF3D6E"/><circle cx="304" cy="340" r="4" fill="#12233A"/>
    <circle cx="200" cy="350" r="7" fill="#FFB627"/>
    <rect x="34" y="320" width="128" height="26" rx="13" fill="#0B1020" opacity="0.9"/>
    <text x="48" y="337" font-size="11" fill="#FFF3DD">Kahan Ho &#183; <tspan fill="#1FC98E">3 live</tspan></text>

    <!-- activity -->
    <rect x="24" y="426" width="292" height="58" rx="12" fill="#1F2E54"/>
    <circle cx="52" cy="455" r="15" fill="#131C36" stroke="#FFB627" stroke-width="1.5"/>
    <text x="76" y="450" font-size="14" fill="#FFF3DD">Rooftop dinner</text>
    <text x="76" y="468" font-size="11" fill="#C6B9E0">Priya paid &#183; split 4 ways</text>
    <text x="300" y="460" text-anchor="end" font-family="monospace" font-size="14" fill="#FFF3DD">&#8377;2,400</text>

    <rect x="24" y="494" width="292" height="58" rx="12" fill="#1F2E54"/>
    <circle cx="52" cy="523" r="15" fill="#131C36" stroke="#FF3D6E" stroke-width="1.5"/>
    <text x="76" y="518" font-size="14" fill="#FFF3DD">38 photos &#8594; Taweez</text>
    <text x="76" y="536" font-size="11" fill="#C6B9E0">from 3 phones &#183; auto-albumed</text>
    <text x="300" y="528" text-anchor="end" font-family="monospace" font-size="12" fill="#1FC98E">NEW</text>

    <circle cx="288" cy="600" r="30" fill="#FFB627"/>
    <text x="288" y="612" text-anchor="middle" font-size="30" font-weight="600" fill="#2A1A00">+</text>
    <rect x="140" y="664" width="60" height="4" rx="2" fill="#2E3E63"/>
  </g>

  <!-- departures board peeking behind -->
  <g transform="translate(880,560) rotate(-4)" filter="url(#sh)">
    <rect width="230" height="200" rx="12" fill="#182545" stroke="#FFB627" stroke-width="2"/>
    <rect x="5" y="5" width="220" height="190" rx="8" fill="none" stroke="#FF3D6E" stroke-width="1.3" stroke-dasharray="5 4" opacity="0.5"/>
    <text x="20" y="34" font-size="10" letter-spacing="3" fill="#8C86B8">SQUAD DEPARTURES</text>
    <text x="20" y="70" font-family="monospace" font-size="13" fill="#FFB627">21:40</text><text x="76" y="70" font-size="13" fill="#FFF3DD">Goa &#8212; 4 friends</text><text x="212" y="70" text-anchor="end" font-size="10" fill="#1FC98E">BOARD</text>
    <line x1="20" y1="82" x2="210" y2="82" stroke="#FFB627" stroke-opacity="0.2" stroke-dasharray="4 4"/>
    <text x="20" y="112" font-family="monospace" font-size="13" fill="#FFB627">22:15</text><text x="76" y="112" font-size="13" fill="#FFF3DD">Jaipur &#8212; Day 2</text><text x="212" y="112" text-anchor="end" font-size="10" fill="#8C86B8">ENROUTE</text>
    <line x1="20" y1="124" x2="210" y2="124" stroke="#FFB627" stroke-opacity="0.2" stroke-dasharray="4 4"/>
    <text x="20" y="154" font-family="monospace" font-size="13" fill="#FFB627">23:05</text><text x="76" y="154" font-size="13" fill="#FFF3DD">Hike &#8212; 5 going</text><text x="212" y="154" text-anchor="end" font-size="10" fill="#8C86B8">CONF</text>
    <line x1="20" y1="166" x2="210" y2="166" stroke="#FFB627" stroke-opacity="0.2" stroke-dasharray="4 4"/>
    <text x="20" y="186" font-family="monospace" font-size="13" fill="#FFB627">--:--</text><text x="76" y="186" font-size="13" fill="#FFF3DD">Your Trip</text><text x="212" y="186" text-anchor="end" font-size="10" fill="#1FC98E">NOW</text>
  </g>
