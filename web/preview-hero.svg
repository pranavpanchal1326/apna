    <text x="34" y="112" font-size="13" fill="#C6B9E0">4 friends &#183; Day 3 of 6 &#183; Anjuna</text>
    <circle cx="278" cy="86" r="15" fill="#FFB627"/><text x="278" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#2A1A00">P</text>
    <circle cx="304" cy="86" r="15" fill="#1FC98E" stroke="#131C36" stroke-width="2"/><text x="304" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#0B1020">A</text>

