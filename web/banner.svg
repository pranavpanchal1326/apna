      <text x="42" y="170">Priya</text><text x="558" y="170" text-anchor="end" fill="#2E6B45" font-family="Consolas, monospace">+&#8377;3,180</text>
      <line x1="42" y1="188" x2="558" y2="188" stroke="#241E10" stroke-opacity="0.15" stroke-dasharray="5 6"/>
      <text x="42" y="228">Rohan</text><text x="558" y="228" text-anchor="end" fill="#A23B22" font-family="Consolas, monospace">&#8722;&#8377;1,240</text>
      <line x1="42" y1="246" x2="558" y2="246" stroke="#241E10" stroke-opacity="0.15" stroke-dasharray="5 6"/>
      <text x="42" y="286">Aisha</text><text x="558" y="286" text-anchor="end" fill="#2E6B45" font-family="Consolas, monospace">+&#8377;940</text>
