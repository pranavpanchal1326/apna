    <rect width="360" height="86" rx="8" fill="#F2B441" filter="url(#soft)"/>
    <text x="30" y="38" font-size="26" font-weight="800" letter-spacing="4" fill="#191204">APNA JUNCTION</text>
    <text x="30" y="68" font-size="20" fill="#191204" opacity="0.85">अपना जंक्शन</text>
  </g>

  <!-- headline -->
  <text x="155" y="700" font-size="58" font-weight="700" fill="#EFE9DA" letter-spacing="-1">One trip. One coach. <tspan fill="#F2B441">Everyone&#8217;s in.</tspan></text>
  <text x="155" y="756" font-size="27" fill="#9BA894">Money netted &#183; memories kept &#183; nobody lost at the night market.</text>

  <!-- feature chips -->
  <g font-size="23" fill="#EFE9DA">
    <rect x="152" y="800" width="215" height="58" rx="29" fill="none" stroke="#EFE9DA" stroke-opacity="0.22"/>
