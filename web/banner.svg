    <line x1="1220" y1="958" x2="1220" y2="990"/><line x1="1270" y1="958" x2="1270" y2="990"/><line x1="1320" y1="958" x2="1320" y2="990"/>
    <line x1="1370" y1="958" x2="1370" y2="990"/><line x1="1420" y1="958" x2="1420" y2="990"/><line x1="1470" y1="958" x2="1470" y2="990"/>
    <line x1="1520" y1="958" x2="1520" y2="990"/><line x1="1570" y1="958" x2="1570" y2="990"/><line x1="1620" y1="958" x2="1620" y2="990"/>
    <line x1="1670" y1="958" x2="1670" y2="990"/><line x1="1720" y1="958" x2="1720" y2="990"/><line x1="1770" y1="958" x2="1770" y2="990"/>
    <line x1="1820" y1="958" x2="1820" y2="990"/><line x1="1870" y1="958" x2="1870" y2="990"/><line x1="1920" y1="958" x2="1920" y2="990"/>
