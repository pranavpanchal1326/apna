    <rect x="385" y="800" width="215" height="58" rx="29" fill="none" stroke="#EFE9DA" stroke-opacity="0.22"/>
    <text x="492" y="837" text-anchor="middle">Live location</text>
    <rect x="618" y="800" width="190" height="58" rx="29" fill="none" stroke="#EFE9DA" stroke-opacity="0.22"/>
    <text x="713" y="837" text-anchor="middle">Memories</text>
    <rect x="826" y="800" width="180" height="58" rx="29" fill="#F2B441"/>
    <text x="916" y="837" text-anchor="middle" fill="#231A05" font-weight="600">Chalein?</text>
  </g>

  <!-- tech strip -->
