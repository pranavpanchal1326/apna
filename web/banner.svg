    <text x="42" y="118" font-size="18" fill="#241E10" opacity="0.6" font-family="Consolas, monospace">PNR APN-2026-0719</text>
    <text x="558" y="118" font-size="18" text-anchor="end" fill="#241E10" opacity="0.6" font-family="Consolas, monospace">CHART PREPARED</text>

