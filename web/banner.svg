<svg width="2000" height="1000" viewBox="0 0 2000 1000" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <radialGradient id="skyGlow" cx="30%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#18251D"/>
      <stop offset="55%" stop-color="#101812"/>
      <stop offset="100%" stop-color="#0B110D"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F2B441" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F2B441" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="potli" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F2B441"/>
      <stop offset="100%" stop-color="#7FBF8E"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- night sky -->
  <rect width="2000" height="1000" fill="url(#skyGlow)"/>

  <!-- stars -->
  <g fill="#EFE9DA">
    <circle cx="120" cy="90" r="1.6" opacity="0.5"/><circle cx="340" cy="60" r="1.2" opacity="0.35"/>
    <circle cx="520" cy="140" r="1.8" opacity="0.55"/><circle cx="760" cy="70" r="1.3" opacity="0.4"/>
    <circle cx="980" cy="120" r="1.5" opacity="0.5"/><circle cx="1180" cy="55" r="1.2" opacity="0.3"/>
    <circle cx="1420" cy="100" r="1.7" opacity="0.5"/><circle cx="1650" cy="65" r="1.3" opacity="0.4"/>
    <circle cx="1840" cy="130" r="1.9" opacity="0.6"/><circle cx="1930" cy="70" r="1.2" opacity="0.35"/>
    <circle cx="240" cy="210" r="1.3" opacity="0.35"/><circle cx="880" cy="200" r="1.4" opacity="0.4"/>
    <circle cx="1560" cy="190" r="1.4" opacity="0.4"/><circle cx="1750" cy="240" r="1.2" opacity="0.3"/>
    <circle cx="660" cy="250" r="1.1" opacity="0.3"/><circle cx="1300" cy="160" r="1.5" opacity="0.45"/>
  </g>

  <!-- catenary wire -->
  <path d="M0 150 Q 250 195 500 150 T 1000 150 T 1500 150 T 2000 150" fill="none" stroke="#EFE9DA" stroke-opacity="0.14" stroke-width="2"/>
  <line x1="0" y1="150" x2="2000" y2="150" stroke="#EFE9DA" stroke-opacity="0.1" stroke-width="1.5"/>

  <!-- ============ LEFT: brand + message ============ -->
  <!-- dhaga logo -->
  <g transform="translate(150,260) scale(2.1)">
    <circle cx="54" cy="66" r="26" fill="none" stroke="#D96A50" stroke-width="7" stroke-linecap="round" stroke-dasharray="13.79 9.55" stroke-dashoffset="6.9"/>
    <path d="M 84 40 L 84 76 Q 84 96 102 92" fill="none" stroke="#D96A50" stroke-width="7" stroke-linecap="round"/>
    <circle cx="84" cy="40" r="6.5" fill="#EFE9DA"/>
  </g>
  <text x="392" y="474" font-size="150" font-weight="800" letter-spacing="-8" fill="#EFE9DA">pna</text>

  <!-- station board -->
