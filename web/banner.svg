  <!-- km markers -->
  <text x="30" y="945" font-size="16" letter-spacing="3" fill="#66735F" font-family="Consolas, monospace">KM 0 &#183; APNA JUNCTION</text>
  <text x="1970" y="945" font-size="16" letter-spacing="3" text-anchor="end" fill="#66735F" font-family="Consolas, monospace">KM &#8734; &#183; WHEREVER SQUAD GOES</text>
